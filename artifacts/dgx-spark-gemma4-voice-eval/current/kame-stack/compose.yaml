services:
  kame-interface-vllm:
    image: ${HERMES_DGX_SPARK_VLLM_IMAGE:-vllm/vllm-openai:gemma4-cu130}
    ipc: host
    gpus: all
    ports:
      - "8000:8000"
    volumes:
      - "${HERMES_DGX_SPARK_MODEL_CACHE:-/Users/jethac/.cache/huggingface}:/root/.cache/huggingface"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${HERMES_KAME_INTERFACE_MODEL:-gemma-4-E2B-it}
      - --served-model-name
      - ${HERMES_KAME_INTERFACE_MODEL:-gemma-4-E2B-it}
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.18"
      - --limit-mm-per-prompt
      - '{"audio":1,"image":0}'

  kame-oracle-vllm:
    image: ${HERMES_DGX_SPARK_VLLM_IMAGE:-vllm/vllm-openai:gemma4-cu130}
    ipc: host
    gpus: all
    ports:
      - "8001:8001"
    volumes:
      - "${HERMES_DGX_SPARK_MODEL_CACHE:-/Users/jethac/.cache/huggingface}:/root/.cache/huggingface"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --model
      - ${HERMES_KAME_ORACLE_MODEL:-nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4}
      - --served-model-name
      - ${HERMES_KAME_ORACLE_MODEL:-nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4}
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.62"
      - --limit-mm-per-prompt
      - '{"audio":0,"image":0}'

  hermes-realtime-sidecar:
    image: ${HERMES_DGX_SPARK_HERMES_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
    working_dir: /workspace/hermes-agent
    depends_on:
      - kame-interface-vllm
      - kame-oracle-vllm
      - kame-asr-bridge
      - kame-tts-bridge
    ports:
      - "8765:8765"
    volumes:
      - ${HERMES_REPO_DIR:-/Volumes/MacMiniOffload/home/projects/hermes-agent/.codex-worktrees/full-kame-reflex-voice}:/workspace/hermes-agent
      - ${HERMES_HOME:-/Users/jethac/.hermes}:/root/.hermes
    environment:
      HERMES_HOME: /root/.hermes
      HERMES_KAME_INTERFACE_PROVIDER: gemma4
      HERMES_KAME_INTERFACE_BASE_URL: http://kame-interface-vllm:8000/v1
      HERMES_KAME_INTERFACE_API_KEY: ${HERMES_KAME_INTERFACE_API_KEY:-}
      HERMES_VOICE_VLLM_BASE_URL: http://kame-interface-vllm:8000/v1
      HERMES_VOICE_VLLM_TOKEN: ${HERMES_KAME_INTERFACE_API_KEY:-}
      HERMES_VOICE_VLLM_MODEL: ${HERMES_KAME_INTERFACE_MODEL:-gemma-4-E2B-it}
      HERMES_VOICE_STREAMING_STT_BASE_URL: http://kame-asr-bridge:8767
      HERMES_DGX_SPARK_ASR_PROVIDER: streaming_stt
      HERMES_VOICE_STREAMING_STT_MODEL: ${HERMES_VOICE_STREAMING_STT_MODEL:-oracle-verbatim-asr}
      HERMES_VOICE_STREAMING_TTS_BASE_URL: http://kame-tts-bridge:8768
      HERMES_DGX_SPARK_TTS_PROVIDER: streaming_tts
      HERMES_VOICE_STREAMING_TTS_MODEL: ${HERMES_VOICE_STREAMING_TTS_MODEL:-local-streaming-tts}
    command:
      - uv
      - run
      - --extra
      - voice
      - python
      - -m
      - hermes_cli.realtime_voice_sidecar
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --interface-base-url
      - http://kame-interface-vllm:8000/v1
      - --vllm-base-url
      - http://kame-interface-vllm:8000/v1
      - --vllm-model
      - ${HERMES_KAME_INTERFACE_MODEL:-gemma-4-E2B-it}
      - --streaming-stt-base-url
      - http://kame-asr-bridge:8767
      - --streaming-stt-model
      - ${HERMES_VOICE_STREAMING_STT_MODEL:-oracle-verbatim-asr}
      - --streaming-tts-base-url
      - http://kame-tts-bridge:8768
      - --streaming-tts-model
      - ${HERMES_VOICE_STREAMING_TTS_MODEL:-local-streaming-tts}

  kame-asr-bridge:
    image: ${HERMES_DGX_SPARK_HERMES_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
    working_dir: /workspace/hermes-agent
    ports:
      - "8767:8767"
    volumes:
      - ${HERMES_REPO_DIR:-/Volumes/MacMiniOffload/home/projects/hermes-agent/.codex-worktrees/full-kame-reflex-voice}:/workspace/hermes-agent
      - ${HERMES_HOME:-/Users/jethac/.hermes}:/root/.hermes
    environment:
      HERMES_HOME: /root/.hermes
      HERMES_DGX_SPARK_ASR_PROVIDER: streaming_stt
      HERMES_DGX_SPARK_ASR_ADAPTER: loopback_smoke_bridge
      HERMES_VOICE_STREAMING_STT_MODEL: oracle-verbatim-asr

    command:
      - uv
      - run
      - --extra
      - voice
      - python
      - -m
      - hermes_cli.realtime_voice_loopback_bridge
      - --host
      - 0.0.0.0
      - --port
      - "8767"

      - --production-en-ja

  kame-tts-bridge:
    image: ${HERMES_DGX_SPARK_HERMES_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
    working_dir: /workspace/hermes-agent
    ports:
      - "8768:8768"
    volumes:
      - ${HERMES_REPO_DIR:-/Volumes/MacMiniOffload/home/projects/hermes-agent/.codex-worktrees/full-kame-reflex-voice}:/workspace/hermes-agent
      - ${HERMES_HOME:-/Users/jethac/.hermes}:/root/.hermes
    environment:
      HERMES_HOME: /root/.hermes
      HERMES_DGX_SPARK_TTS_PROVIDER: streaming_tts
      HERMES_DGX_SPARK_TTS_ADAPTER: loopback_smoke_bridge
      HERMES_VOICE_STREAMING_TTS_MODEL: local-streaming-tts

    command:
      - uv
      - run
      - --extra
      - voice
      - python
      - -m
      - hermes_cli.realtime_voice_loopback_bridge
      - --host
      - 0.0.0.0
      - --port
      - "8768"

      - --production-en-ja
